# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples

name: Lint Check

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  # Also run on master pushes so this job's dependency cache (keyed by its
  # own extra-packages: lintr, roxygen2@8.0.0, local::.) gets seeded
  # somewhere durable, mirroring R-CMD-check-extended.yaml. Without this,
  # the job never ran outside of PRs, cache-cleanup.yaml deletes each PR's
  # own cache the moment it closes, and every subsequent PR paid a full
  # from-scratch R + dependency install (13m setup-r + 29m
  # setup-r-dependencies) instead of restoring a warm cache.
  push:
    branches: master

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned to the Config/roxygen2/version in DESCRIPTION
          # (roxygen2 8 writes that field instead of RoxygenNote) so the
          # docs-drift check below regenerates the exact same output as a
          # contributor running `make document` locally with that version.
          # Bump this alongside Config/roxygen2/version if it ever changes.
          extra-packages: any::lintr, roxygen2@8.0.0, local::.
          needs: lint

      - name: Lint
        run: |
          devtools::load_all()
          lintr::lint_package()
        shell: Rscript {0}

      # Regenerates R/generated_check_manifest.R (via `make generate-check-manifest`'s
      # underlying script) and the roxygen2 docs, then fails on any drift. This is the
      # staleness guard for a forgotten `make document` before a commit.
      - name: Check generated docs are up to date
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          Rscript scripts/R/generate_check_manifest.R
          Rscript -e "devtools::document()"
          if ! git diff --exit-code -- man NAMESPACE R/generated_check_manifest.R; then
            echo "::error::man/, NAMESPACE, or R/generated_check_manifest.R are out of date. Run 'make document' locally and commit the result. This job pins roxygen2 to the Config/roxygen2/version in DESCRIPTION, so a clean local diff with the same roxygen2 version means this is real drift, not version skew."
            exit 1
          fi
