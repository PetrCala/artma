# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# PR gate: release R on the three major platforms, without vignettes, plus a
# cut-down E2E smoke test (tests/E2E/test-smoke.R) exercising a couple of
# runtime methods on a tiny fixture dataset. The full matrix (plus R-devel and
# oldrel, with vignettes) and the nightly E2E suite run separately; this job
# is a fast companion to those.
# The full matrix (plus R-devel and oldrel, with vignettes) runs after
# merges in R-CMD-check-extended.yaml, which also saves the dependency
# caches on master so every PR branch can restore them.
# The paths filter skips this gate on PRs that cannot change check results
# (docs-only or CI-only changes). Safe because the master ruleset has no
# required status checks: a path-skipped workflow reports no check, and
# gh pr checks treats absent checks as green.
name: R CMD Check

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "R/**"
      - "inst/**"
      - "src/**"
      - "tests/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/R-CMD-check.yaml"
      - ".github/actions/setup-jags/**"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # cpus matches the runner vCPU count: ubuntu/windows have 4,
          # macos-latest (arm64) has 3.
          - { os: macos-latest, r: "release", cpus: 3 }
          - { os: windows-latest, r: "release", cpus: 4 }
          - { os: ubuntu-latest, r: "release", cpus: 4 }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # testthat's parallel worker count defaults to 2 regardless of the
      # machine (default_num_cpus falls back to 2L); the test phase is the
      # bulk of the check step, so use every runner core.
      TESTTHAT_CPUS: ${{ matrix.config.cpus }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Setup JAGS
        uses: ./.github/actions/setup-jags

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # No --as-cran on the PR gate: it costs 20-30s per matrix leg.
          # R-CMD-check-extended.yaml keeps the check-r-package default args
          # (which include --as-cran) on every master push and weekly, so
          # CRAN-facing findings still surface within one merge.
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'

  e2e-smoke:
    runs-on: ubuntu-latest

    name: E2E smoke test

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: e2e

      - name: Run E2E smoke test
        working-directory: tests/E2E
        run: Rscript test-smoke.R
