name: Commit Lint

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
  # Runs on master purely so the dependency cache gets written to the default
  # branch, which is the only scope every PR can read from. Without this the
  # cache below is per-PR and the first run of every new PR pays the install.
  push:
    branches: [master]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Caches created on a PR branch are readable only by that branch; only
      # default-branch caches are shared. The push trigger above keeps a master
      # cache populated so PR runs restore from it instead of reinstalling.
      - name: Restore commitlint dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: commitlint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install commitlint
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

# Cache-fallback probe (temporary branch, not for merge).
