# Coverage gate: a single traced test-suite run (scripts/R/inst_coverage.R)
# produces both reports at once: cobertura.xml for the R/ surface and
# cobertura-inst.xml for the box-managed inst/artma tree. This used to be
# two sequential full suite runs (covr::package_coverage for R/, then the
# inst script), which doubled the wall clock; the price of the merge is
# that compiled src/ lines are no longer measured (covr's gcov pass needs
# its own instrumented install).
name: Test Coverage

on:
  pull_request:
    branches: master
  push:
    branches: master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: coverage

      - name: Coverage (R/ and inst/artma, one traced test run)
        run: Rscript scripts/R/inst_coverage.R
        env:
          ARTMA_COVERAGE_COBERTURA: "true"
          ARTMA_COVERAGE_STRICT: "true"

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml,./cobertura-inst.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
