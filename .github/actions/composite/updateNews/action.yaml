name: 'Update NEWS.md'
description: 'Generates and commits NEWS.md using git-chglog'

inputs:
  NEW_VERSION:
    required: true
    description: 'The new version tag (e.g., 1.2.3)'
  ARTMA_BOT_COMMIT_TOKEN:
    required: true
    description: 'Personal access token for ArtmaBot'
  LARGE_SECRET_PASSPHRASE:
    required: true
    description: 'GPG passphrase for committing as ArtmaBot'

runs:
  using: "composite"
  steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        ref: master
        token: ${{ inputs.ARTMA_BOT_COMMIT_TOKEN }}

    # Installed from the upstream release tarball rather than Homebrew.
    # git-chglog only ships via its own tap, and Homebrew now refuses formulae
    # from untrusted third-party taps, which broke every release build. A
    # pinned binary also drops the ~40s Homebrew bootstrap.
    - name: Install git-chglog
      shell: bash
      env:
        CHGLOG_VERSION: 0.15.4
      run: |
        set -euo pipefail
        curl -fsSL -o chglog.tar.gz \
          "https://github.com/git-chglog/git-chglog/releases/download/v${CHGLOG_VERSION}/git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz"
        tar -xzf chglog.tar.gz git-chglog
        sudo install -m 755 git-chglog /usr/local/bin/git-chglog
        rm -f chglog.tar.gz git-chglog
        git-chglog --version

    - name: Setup git for ArtmaBot
      uses: ./.github/actions/composite/setupGitForArtmaBot
      with:
        GPG_PASSPHRASE: ${{ inputs.LARGE_SECRET_PASSPHRASE }}

    - name: Fetch the latest changes
      shell: bash
      run: |
        git fetch origin master
        git fetch --tags

    - name: Update NEWS
      shell: bash
      run: |
        git-chglog --output NEWS.md --next-tag "v${{ inputs.NEW_VERSION }}"

    - name: Commit NEWS if changed
      shell: bash
      run: |
        git add NEWS.md
        if ! git diff --cached --quiet; then
          git commit -m "docs: update NEWS.md for v${{ inputs.NEW_VERSION }}"
        else
          echo "No changes to NEWS.md"
        fi

    - name: Push changes to master
      shell: bash
      run: |
        git remote set-url origin git@github.com:${{ github.repository }}.git
        git pull --rebase origin master
        git push origin master