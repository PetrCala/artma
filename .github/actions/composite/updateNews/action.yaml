name: 'Update NEWS.md'
description: 'Generates and commits NEWS.md using git-chglog'

inputs:
  NEW_VERSION:
    required: true
    description: 'The new version tag (e.g., 1.2.3)'
  ARTMA_BOT_COMMIT_TOKEN:
    required: true
    description: 'Personal access token for ArtmaBot'
  LARGE_SECRET_PASSPHRASE:
    required: true
    description: 'GPG passphrase for committing as ArtmaBot'

runs:
  using: "composite"
  steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        ref: master
        token: ${{ inputs.ARTMA_BOT_COMMIT_TOKEN }}
        # git-chglog derives the new version's commit range from
        # `<latest tag>..HEAD`. The default shallow checkout grafts HEAD to a
        # single commit, so that range collapses to the release commit alone
        # and the new section comes out empty. Full history is required.
        fetch-depth: 0

    # Installed from the upstream release tarball rather than Homebrew.
    # git-chglog only ships via its own tap, and Homebrew now refuses formulae
    # from untrusted third-party taps, which broke every release build. A
    # pinned binary also drops the ~40s Homebrew bootstrap.
    - name: Install git-chglog
      shell: bash
      env:
        CHGLOG_VERSION: 0.15.4
      run: |
        set -euo pipefail
        curl -fsSL -o chglog.tar.gz \
          "https://github.com/git-chglog/git-chglog/releases/download/v${CHGLOG_VERSION}/git-chglog_${CHGLOG_VERSION}_linux_amd64.tar.gz"
        tar -xzf chglog.tar.gz git-chglog
        sudo install -m 755 git-chglog /usr/local/bin/git-chglog
        rm -f chglog.tar.gz git-chglog
        git-chglog --version

    - name: Setup git for ArtmaBot
      uses: ./.github/actions/composite/setupGitForArtmaBot
      with:
        GPG_PASSPHRASE: ${{ inputs.LARGE_SECRET_PASSPHRASE }}

    - name: Fetch the latest changes
      shell: bash
      run: |
        git fetch origin master
        git fetch --tags --force
        # Guard against a shallow checkout silently truncating the changelog
        # range (see fetch-depth above).
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Repository is shallow; git-chglog needs full history." >&2
          exit 1
        fi

    - name: Update NEWS
      shell: bash
      env:
        NEW_TAG: v${{ inputs.NEW_VERSION }}
      run: |
        git-chglog --output NEWS.md --next-tag "$NEW_TAG"

        # An empty section means the commit range or the Conventional Commits
        # header pattern in .chglog/config.yml stopped matching. Fail here
        # rather than pushing an empty changelog and publishing empty release
        # notes off the back of it.
        if ! sed -n "/^<a name=\"$NEW_TAG\"><\/a>$/,/^<a name=/p" NEWS.md | grep -q '^\* '; then
          echo "::error::git-chglog produced no entries for $NEW_TAG. Check the commit range and .chglog/config.yml."
          exit 1
        fi

    - name: Commit NEWS if changed
      shell: bash
      run: |
        git add NEWS.md
        if ! git diff --cached --quiet; then
          git commit -m "docs: update NEWS.md for v${{ inputs.NEW_VERSION }}"
        else
          echo "No changes to NEWS.md"
        fi

    - name: Push changes to master
      shell: bash
      run: |
        git remote set-url origin git@github.com:${{ github.repository }}.git
        git pull --rebase origin master
        git push origin master