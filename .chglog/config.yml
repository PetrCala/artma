style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/PetrCala/artma
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
  commit_groups:
    title_maps:
      feat: Features
      fix: Bug Fixes
      perf: Performance Improvements
      refactor: Code Refactoring
  header:
    # Conventional Commits, with the scope group optional and an optional
    # `!` breaking-change marker. Single-quoted so the regex is not also
    # subject to YAML backslash escaping.
    pattern: '^(\w+)(?:\(([^()]+)\))?!?:\s(.*)$'
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
