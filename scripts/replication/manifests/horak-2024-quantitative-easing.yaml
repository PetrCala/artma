id: horak-2024-quantitative-easing

thesis:
  author: "Horák, Matyáš"
  title: "The Effects of Quantitative Easing: A Meta-Analysis"
  degree: bachelor
  year: 2024
  advisor: "Havránek, Tomáš"
  handle: "20.500.11956/193473"
  url: "https://dspace.cuni.cz/handle/20.500.11956/193473"

dataset:
  url: "https://dspace.cuni.cz/bitstream/handle/20.500.11956/193473/130404211.zip?sequence=4&isAllowed=y"
  archive_member: "Data.csv"
  sha256: "6f6f7e5eda04653b708cadb180f04404b2b05c15e41c91a23970520044815d55"
  code_published: true
  code_files: ["Code.txt"]

# The file is laid out as one block per outcome (GDP peak, GDP cumulative,
# inflation peak, inflation cumulative), each block being <outcome>, se, t_stat.
# That makes `se` appear four times; the harness renames the repeats to `se__2`
# etc., so the bare `se` below is unambiguously the one belonging to GDP_peak.
# Rows without a peak-GDP estimate drop out, leaving the 43 the thesis reports.
# Winsorization matched to the thesis's own published code:
# Code.txt is an artma-style config that sets `data_winsorization_level:
# 0.025` with `winsorize_precision: true`.
artma_options:
  data.winsorization_level: 0.025

columns:
  effect: "GDP_peak"
  se: "se"
  study_id: "study_id"
  n_obs: "obs_n"

claims:
  - id: mean_effect
    label: "Sample mean, peak effect on GDP"
    reported: 0.239
    source: "Table 3.2, p. 12 (All Data)"
    method: effect_summary_stats
    artma_model: "^All Data$"
    artma_term: "^mean$"

  - id: fat_ols
    label: "Publication bias, OLS"
    reported: 1.283
    reported_se: 0.129
    source: "Table 4.1, p. 19 (Peak Effect on GDP)"
    method: linear_tests
    artma_model: "^ols$"
    artma_term: "^publication_bias$"

  - id: pet_ols
    label: "Effect beyond bias, OLS"
    reported: 0.012
    reported_se: 0.019
    source: "Table 4.1, p. 19 (Peak Effect on GDP)"
