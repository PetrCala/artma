    label: "Mean elasticity (milk composite)"
    reported: -0.60
    source: "Table 3.1, p. 11"
    method: effect_summary_stats
    artma_model: "^All Data$"
    artma_term: "^mean$"

  - id: median_effect
    label: "Median elasticity"
    reported: -0.38
    source: "Table 3.1, p. 11"
