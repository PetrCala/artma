id: krenkova-2023-milk-elasticity

thesis:
  author: "Křenková, Pavlína"
  title: "The Price Elasticity of Milk Demand: A Meta-Analysis"
  degree: bachelor
  year: 2023
  advisor: "Havránková, Zuzana"
