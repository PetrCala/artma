  sha256: "4945c70bc6d1442f1b7c93baad8198c3f0c6180428b4c85212e9102b8feae019"
  # The published file pools all three goods; every table replicated here is the
  # "milk composite" panel, which the thesis defines by this dummy (138 of 291).
  row_filter: "Milk == 1"
  code_published: true
  code_files: ["code.R"]

columns:
  effect: "Estimate"
  se: "Standard_Error"
  study_id: "Study_Code"
  n_obs: "observations"

claims:
