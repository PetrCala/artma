id: simpartl-2023-military-growth

thesis:
  author: "Simpartl, Josef"
  title: "Military expenditure and economic growth: A meta-analysis"
  degree: master
  year: 2023
  advisor: "Havránek, Tomáš"
  handle: "20.500.11956/179460"
  url: "https://dspace.cuni.cz/handle/20.500.11956/179460"

dataset:
  url: "https://dspace.cuni.cz/bitstream/handle/20.500.11956/179460/120437192.zip?sequence=4&isAllowed=y"
  archive_member: "Milex_Meta_Dataset.csv"
  sha256: "0265fafe034b3d0b3ebd962c3059dc640fb0975ba0c18d9febc15edeb18434c0"
  # Exported from a Czech-locale spreadsheet: numerics arrive as quoted strings
  # such as "0,2065" and are unreadable without this.
  decimal_mark: ","
  code_published: true
  code_files: ["RCode.txt"]

columns:
  effect: "PCC"
  se: "PCCSE"
  study_id: "ID"
  n_obs: "Nobs"

# Table 1 is the full dataset (405 estimates from 67 studies). The thesis
# reports no plain OLS column, so there is no `ols` claim here.
claims:
  - id: fat_precision
    label: "Publication bias, precision-weighted (WLS)"
    reported: 0.316
    reported_se: 0.171
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^ols_precision_weighted$"
    artma_term: "^publication_bias$"

  - id: pet_precision
    label: "Mean beyond bias, precision-weighted (WLS)"
    reported: -0.083
    reported_se: 0.013
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^ols_precision_weighted$"
    artma_term: "^effect$"

  - id: fat_study
    label: "Publication bias, study-weighted"
    reported: 0.616
    reported_se: 0.225
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^ols_study_weighted$"
    artma_term: "^publication_bias$"

  - id: pet_study
    label: "Mean beyond bias, study-weighted"
    reported: -0.107
    reported_se: 0.027
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^ols_study_weighted$"
    artma_term: "^effect$"

  - id: fat_fe
    label: "Publication bias, fixed effects"
    reported: -0.186
    reported_se: 0.074
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^fe$"
    artma_term: "^publication_bias$"

  - id: pet_fe
    label: "Mean beyond bias, fixed effects"
    reported: -0.059
    reported_se: 0.003
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^fe$"
    artma_term: "^effect$"

  - id: fat_be
    label: "Publication bias, between effects"
    reported: 0.429
    reported_se: 0.141
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^be$"
    artma_term: "^publication_bias$"

  - id: pet_be
    label: "Mean beyond bias, between effects"
    reported: -0.092
    reported_se: 0.011
    source: "Table 1, p. 35"
    method: linear_tests
    artma_model: "^be$"
    artma_term: "^effect$"

  # The IV column instruments the standard error with the inverse sample size;
  # artma exposes the same idea through exogeneity_tests.
  - id: fat_iv
    label: "Publication bias, instrumental variable"
    reported: 0.376
    reported_se: 0.194
    source: "Table 1, p. 35"
    method: exogeneity_tests
    artma_model: "^iv$"
    artma_term: "^publication_bias$"

  - id: pet_iv
    label: "Mean beyond bias, instrumental variable"
    reported: -0.088
    reported_se: 0.014
    source: "Table 1, p. 35"
    method: exogeneity_tests
    artma_model: "^iv$"
    artma_term: "^effect$"
