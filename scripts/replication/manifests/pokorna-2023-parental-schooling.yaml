  # Verified against the published code: `lm(..., weights = win_Precision)` with
  # `win_Precision <- 1/win_St.error`, so the weight really is 1/se, not 1/se^2.
  # That is a genuine departure from the Stanley-Doucouliagos WLS that artma
  # implements, so this pair is expected to diverge.
  - id: fat_precision
    label: "Publication bias, precision-weighted"
    reported: 1.136
    reported_se: 0.093
    source: "Table 4.1, p. 27 (Panel B, causal effects)"
    method: linear_tests
    artma_model: "^ols_precision_weighted$"
    artma_term: "^publication_bias$"

  - id: pet_precision
    label: "Mean beyond bias, precision-weighted"
