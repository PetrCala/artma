# The file holds causal effects and non-causal associations side by side, each
# followed by its own "St. error" column. The harness suffixes the repeat to
# `St. error__2`, so the bare name below is the causal one. Rows with no causal
# estimate drop out on their own, leaving the 387 estimates from 23 studies the
# thesis reports for this panel.
# Winsorization matched to the thesis's own published code:
# Code winsorizes the causal effect and its standard error at probs (0.01,
# 0.99), matching artma's default; set explicitly.
artma_options:
  data.winsorization_level: 0.01

columns:
  effect: "Causal effect"
  se: "St. error"
  study_id: "Study"
  n_obs: "Sample size"

claims:
  - id: fat_ols
    label: "Publication bias, OLS"
    reported: 1.350
    reported_se: 0.109
    source: "Table 4.1, p. 27 (Panel A, causal effects)"
    method: linear_tests
    artma_model: "^ols$"
    artma_term: "^publication_bias$"

  - id: pet_ols
    label: "Mean beyond bias, OLS"
    reported: 0.044
