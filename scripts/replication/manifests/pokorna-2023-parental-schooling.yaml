id: pokorna-2023-parental-schooling

thesis:
  author: "Pokorná, Anastasia"
  title: "The Causal Effect of Parents' Schooling on Children's Schooling: A Meta-Analysis"
  degree: master
  year: 2023
  advisor: "Havránková, Zuzana"
  handle: "20.500.11956/179488"
  url: "https://dspace.cuni.cz/handle/20.500.11956/179488"

dataset:
