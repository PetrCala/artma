    reported: 0.377
    reported_se: 0.143
    source: "Table 4.1, p. 26"
    method: linear_tests
    artma_model: "^ols$"
    artma_term: "^publication_bias$"

  - id: pet_ols
    label: "Effect beyond bias, OLS"
    reported: 0.070
    reported_se: 0.004
    source: "Table 4.1, p. 26"
    method: linear_tests
    artma_model: "^ols$"
    artma_term: "^effect$"

  - id: fat_study
