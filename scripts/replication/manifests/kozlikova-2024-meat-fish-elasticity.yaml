id: kozlikova-2024-meat-fish-elasticity

thesis:
  author: "Kozlíková, Kateřina"
  title: "Price elasticities of meat, fish and seafood: A meta-analysis"
  degree: bachelor
  year: 2024
  advisor: "Havránková, Zuzana"
  handle: "20.500.11956/193521"
  url: "https://dspace.cuni.cz/handle/20.500.11956/193521"

dataset:
  url: "https://dspace.cuni.cz/bitstream/handle/20.500.11956/193521/130403547.zip?sequence=4&isAllowed=y"
  archive_member: "data_cleaned.csv"
  sha256: "1694f7b7f1339c9a99d0dcfe8d107e41296c44e99126c77c21263d761a59343d"
  # Table 4.1 is split into four panels. This manifest replicates the
  # "Marshallian / Meat" panel, which the thesis reports as N = 202 — exactly the
  # count this filter selects from the published file.
  row_filter: "Uncompensated_Marshallian == 1 & Fish == 0 & Seafood == 0"
  code_published: true
  code_files: ["code.txt"]

# 13 of the 202 estimates have no reported sample size. artma treats n_obs as a
# required column and aborts on gaps, so they are median-imputed to keep the
# sample at the 202 the thesis reports. This does not touch the compared
# numbers: with the default `precision_type: 1/SE`, none of the six linear
# models takes n_obs as an input (they weight by `precision` = 1/se or by
# `study_size` = estimates per study). Dropping the rows instead would change
# the very estimates under comparison.
# Winsorization matched to the thesis's own published code:
# code.txt winsorizes the *effect only*, asymmetrically at probs (0.01,
# 0.95), and leaves the standard error untouched. artma's winsorization is
# symmetric and covers se as well, so it cannot express this; 0 is the
# closest faithful setting.
artma_options:
  data.winsorization_level: 0
  data.na_handling: "median"

columns:
  effect: "Estimate"
  se: "Standard_Error"
  study_id: "Study_Code"
  n_obs: "No_observations"

claims:
