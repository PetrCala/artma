    label: "Publication bias, OLS"
    reported: -0.484
    reported_se: 0.160
    source: "Table 4.1, p. 25 (Marshallian, Meat)"
    method: linear_tests
    artma_model: "^ols$"
    artma_term: "^publication_bias$"

